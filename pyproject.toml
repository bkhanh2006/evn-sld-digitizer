[project]
name = "sld-digitizer"
version = "0.0.1"
description = "Số hóa sơ đồ nhất thứ trạm biến áp EVN thành đồ thị đấu nối, SVG và DXF"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ezdxf",
    "numpy",
    "opencv-contrib-python==4.10.0.84",   # paddlex ghim đúng bản này; đừng cài thêm opencv-python(-headless)
    "paddleocr>=3.0",
    "paddlepaddle>=3.0",
    "pillow",
    "pydantic>=2",
    "pymupdf",
    "pypdfium2",
    "pyyaml",
    "resvg-py",
    "scikit-image",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
