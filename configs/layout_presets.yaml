# Bố cục vùng cấp điện áp (SDD 8.1.3). Đơn vị mm.
#   hv: thanh cái ngang ở dải trên; đường dây đi lên, ngăn MBA và TU đi xuống.
#   bottom_level: cấp áp ở dải dưới, thanh cái ngang, xuất tuyến đi xuống.
#   side_level: cấp áp ở dải phải, thanh cái dọc, xuất tuyến sang phải.
#   Trạm 2 cấp áp chỉ dùng bottom_level.
#   incomer_same_side_p: xác suất ngăn tổng treo cùng phía xuất tuyến (dây từ MBA phải đi vòng như E18.9),
#   ngược lại treo phía về MBA (E18.1 với thanh cái 35 kV).

pages:
  A4: [297, 210]
  A3: [420, 297]

frame:
  margin_mm: [15, 6, 6, 6]       # trái (lề đóng gáy), trên, phải, dưới
  inner_pad_mm: 3                # khoảng từ khung tới vùng vẽ
  title_height_mm: 8             # dòng tên sơ đồ ở đầu trang
  title_block_height_mm: [18, 22]

presets:
  E18_9_like:
    pages: [A4, A3]
    bottom_level: mv
    side_level: lv
    incomer_same_side_p: 0.5
    side_bus_drop_mm: [30, 45]   # thanh cái dọc bắt đầu thấp hơn thanh cái 110 kV một đoạn
  E18_like:
    pages: [A3, A4]
    bottom_level: lv
    side_level: mv
    incomer_same_side_p: 0.3
    side_bus_drop_mm: [-15, 5]   # E18.1: thanh cái 35 kV dọc chạy từ gần đầu trang
