# Cấu hình bộ sinh dữ liệu tổng hợp (SDD 8.1). Đơn vị độ dài: mm trên giấy.
version: v001
seed: 20261029
n_samples: 100
variants_per_topology: 2        # mỗi topology vẽ vài lần với bố cục/nét khác; split chia theo topologyId

preset_weights: {E18_like: 0.5, E18_9_like: 0.5}

# SDD 8.1.2. feeder_bays = mọi ngăn trừ ngăn MBA và ngăn tổng (đường dây, xuất tuyến, TU, tự dùng, tụ, liên lạc)
difficulty:
  simple: {weight: 0.25, transformers: [1, 1], levels: [2, 3], feeder_bays: [5, 8]}
  medium: {weight: 0.45, transformers: [2, 2], levels: [2, 3], feeder_bays: [9, 20]}
  complex: {weight: 0.30, transformers: [2, 2], levels: [3, 3], feeder_bays: [20, 26]}

voltages: {hv: 110, mv: 35, lv: 22}

topology:
  hv_lines: [2, 6]               # số ngăn đường dây 110 kV (bị giới hạn bởi feeder_bays)
  hv_two_buses_p: 0.6            # 2 thanh cái 110 kV (C11, C12) khi có ≥ 3 đường dây hoặc 2 MBA
  hv_coupler_breaker_p: 0.5      # liên lạc 112 có máy cắt (E18.1) hay chỉ dao phân đoạn (E18.9)
  line_vt_p: 0.7                 # ngăn đường dây có TU
  line_exit_turn_p: 0.6          # đường dây rẽ ngang ở đầu ngăn (kiểu E18.9)
  bus_vt_p: 0.8                  # mỗi thanh cái có ngăn TU
  aux_p: 0.6                     # có MBA tự dùng ở cấp trung áp
  capacitor_p: 0.3               # có ngăn tụ bù ở cấp 35 kV
  spare_name_p: 0.15             # tên lộ "DỰ PHÒNG"
  mv_breaker_drawout_p: 0.8      # xuất tuyến dùng máy cắt hợp bộ (E18.9) hay DCL + MC (E18.1)
  windings3_p: 0.8               # MBA 3 cuộn khi trạm có 3 cấp áp
  pole_number_p: 0.5

style:
  fonts:
    - {family: Arial, file: arial.ttf, bold: arialbd.ttf, weight: 0.6}
    - {family: Times New Roman, file: times.ttf, bold: timesbd.ttf, weight: 0.4}
  size_mm:                       # cỡ chữ (em) theo loại nhãn
    code: [1.9, 2.4]
    breaker: [2.6, 3.2]
    name: [2.0, 2.6]
    param: [2.4, 3.0]
    bus: [3.0, 3.6]
    title: [4.5, 5.5]
    title_block: [2.0, 2.6]
  wire_mm: [0.2, 0.32]
  busbar_mm: [0.45, 0.8]
  symbol_stroke_scale: [0.8, 1.3]
  junction_dot_p: 0.4            # xác suất một mẫu vẽ chấm ở điểm rẽ trong ngăn
  hop_arc_p: 0.6                 # tỉ lệ điểm giao không nối vẽ cầu vượt (còn lại: chữ thập trơn)
  gap_mm: [2.0, 3.0]             # khe dây giữa hai thiết bị trong ngăn
  tap_stub_mm: [2.5, 3.5]
  bay_margin_mm: [2.0, 5.0]      # khoảng trống giữa hai ngăn cạnh nhau
  label_gap_mm: [0.8, 1.5]
  switch_closed_p: [0.3, 0.8]
  earthing_closed_p: [0.0, 0.15]

render:
  px_per_mm: {A4: [8.0, 12.0], A3: [7.0, 10.0]}
  jpeg_quality: [60, 95]
  blur_sigma_px: [0.0, 0.7]
  gray_unevenness: [0.0, 0.12]   # biên độ xám hóa không đều (nhân với nền mịn)
  skew_max_deg: 0.0              # chưa bật: nghiêng ảnh làm lệch đáp án, cần biến đổi đồ thị theo
  stamp_p: 0.8
  signature_p: 0.8
  red_stamp_color: "#d0312d"

router:
  cell_mm: 1.5
  clearance_mm: 1.2
  bend_cost: 6.0
  cross_cost: 25.0

compose:
  max_attempts: 12               # thử lại bố cục; quá số lần thì bỏ bớt ngăn
